# this file uses prebuilt image in dockerhub
name: suihan-shu-homepage

services:
  jekyll:
    container_name: suihan-shu-homepage
    image: amirpourmand/al-folio:v0.16.3
    build: .
    # uncomment these if you are having this issue with the build:
    # /usr/local/bundle/gems/jekyll-4.3.4/lib/bundler/site.rb:509:in `initialize': Permission denied @ rb_sysopen - /srv/jekyll/.jekyll-cache/.gitignore (Errno::EACCES)
    # and fill the args values with the output of the commands on the right
    # build:
    #   args:
    #     GROUPID: # id -g
    #     GROUPNAME: # id -gn
    #     USERID: # id -u
    #     USERNAME: # echo $USER
    ports:
      - 8040:4000
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - gems:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: bash -c "bundle install && bundle exec jekyll serve --watch --host 0.0.0.0 --port 4000 --livereload --livereload-port 35729 --trace"

volumes:
  gems:
    driver: local
